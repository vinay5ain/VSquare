<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VSquare | 0 Digital Stress</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- HEADER -->
        <header class="header">

            <div class="brand">
                <div class="logo">V²</div>

                <div>
                    <h2>VSquare</h2>
                    <span>0 Digital Stress</span>
                </div>
            </div>

            <div class="online">
                <span></span> Online
            </div>

        </header>


        <!-- CHAT -->
        <main class="chat" id="chat">

            <div class="message bot">
                👋 Hey! I'm the <b>VSquare Digital Assistant.</b>
                <br><br>
                Tell me what's creating digital stress for you.
                <br><br>
                You can simply type something like:
                <br>
                <i>"I have a business but I can't manage Instagram and WhatsApp."</i>
            </div>

        </main>


        <!-- INPUT -->
        <div class="input-area">

            <input
                type="text"
                id="userInput"
                placeholder="Tell me your digital problem..."
                autocomplete="off"
            >

            <button onclick="sendMessage()">
                ➤
            </button>

        </div>

    </div>

    <script src="script.js"></script>
    <p> "Zero Digital Stress" </p>

</body>
</html>
